<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Charley Harper-style minimalist tree -->
  <!-- Trunk — simple offset rectangle -->
  <rect x="21" y="28" width="6" height="14" rx="1" fill="#5a2d0c"/>
  <!-- Canopy — three overlapping circles, flat and geometric -->
  <circle cx="16" cy="22" r="11" fill="#2db84b"/>
  <circle cx="32" cy="22" r="11" fill="#1a9e3f"/>
  <circle cx="24" cy="14" r="11" fill="#3dd65a"/>
  <!-- Single bird — Harper signature, a simple checkmark shape -->
  <path d="M38 8 L40 10 L44 5" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
